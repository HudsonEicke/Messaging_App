# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messaging_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Apply database schema
      env:
        PGPASSWORD: postgres
      run: |
        sed '/^CREATE DATABASE\|^\\c /d' Database/messagingapp.sql | psql -h localhost -U postgres -d messaging_app_test

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
      env:
        ConnectionStrings__MessagingAppContext: "Host=localhost;Database=messaging_app_test;Username=postgres;Password=postgres"
        JwtSettings__SecretKey: "test-secret-key-32-chars-minimum!"
        JwtSettings__Issuer: "http://localhost"
        JwtSettings__Audience: "MessagingAppAPI"
        JwtSettings__AccessTokenExpirationMinutes: "15"
        JwtSettings__RefreshTokenExpirationDays: "7"
        EncryptionSettings__SecretKey: "test-encryption-key-32-chars-min"
